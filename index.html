<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngliGo | Learn English</title>

    <link rel="icon" href="IMG/logo.png">

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/menu.css">
</head>

<body>

    <!-- Audios -->
    <audio id="audioMenu" preload="auto">
        <source src="audio/hover.mp3" type="audio/mpeg" />
    </audio>

    <!-- MENÚ -->
    <aside>

        <div class="brand-logo">
            <img src="IMG/mascota.png" alt="Engli Go Logo">
            <h2>Engli Go</h2>
        </div>

        <nav>
            <ul>
                <li><a href="index.html" class="menu-link">Home</a></li>
                <li><a href="Activity.html" class="menu-link">Learning resources</a></li>
                <li><a href="Games.html" class="menu-link">Games</a></li>
                <li><a href="characters.html" class="menu-link">Characters</a></li>
                <li><a href="sobrenosotros.html" class="menu-link">About us</a></li>
                <li><a href="help.html" class="menu-link">Help</a></li>

                <li id="user-menu-item">
                    <a href="register.html" id="register-button" class="menu-link">
                        Register
                    </a>

                    <span id="registered-user" class="registered-user"></span>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Contenido de la página -->
    <main>
        <section class="hero">
            <h1>Welcome!</h1>
            <p>Click to the video</p>

            <!-- Video de bienvenida -->
            <video id="intro-video" controls>
                <source src="VIDEOS/VIDEO.mp4" type="video/mp4">
            </video>

            <!-- Boton para iniciar -->
            <a href="tarjetas.html" id="btnEntrar">
                <img src="IMG/botoninicio.png" alt="Boton de inicio">
            </a>
        </section>
    </main>

    <!-- JavaScript para audio -->
    <script>
        const audioMenu = document.getElementById('audioMenu');

        document.querySelectorAll('.menu-link').forEach(link => {
            link.addEventListener('mouseenter', () => {
                audioMenu.currentTime = 0;
                audioMenu.volume = 0.4;
                audioMenu.play();
            });
        });
    </script>

    <!-- Mostrar nombre del usuario registrado -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const registerButton = document.getElementById("register-button");
            const registeredUser = document.getElementById("registered-user");

            const nombreUsuario = localStorage.getItem("registeredUser");

            if (nombreUsuario) {
                registerButton.style.display = "none";
                registeredUser.textContent = `Hola, ${nombreUsuario}`;
                registeredUser.style.display = "inline-block";
            } else {
                registerButton.style.display = "inline-block";
                registeredUser.style.display = "none";
            }
        });
    </script>
</body>

</html>
