<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral Travel | Level 1</title>

<link rel="icon" href="IMG/logo.png">

<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="CSS/Nivel1.css">

</head>
<body>

<header class="encabezado-nivel">
  <a href="Astraltravel.html" class="boton-volver">← Return</a>
  <h1 class="titulo-nivel">Level 1 <span class="subtitulo-nivel">Body parts</span></h1>
  <div class="hud">
    <div class="vidas" id="vidas">♥♥♥</div>
    <div class="puntaje">Points: <span id="puntaje">0</span>/10</div>
  </div>
</header>

<main class="contenedor-juego">

  <p class="instruccion">Drag each English word to the correct body part🚀</p>

  <div class="area-juego">

    <div class="imagen-nino" id="imagenNino">
      <img src="IMG/niñocuerpo.png" alt="Niño con partes del cuerpo" id="imgNino" draggable="false">
      <!-- Los puntos de destino (droppables) se generan por JavaScript -->
    </div>

    <div class="banco-etiquetas" id="bancoEtiquetas">
      <!-- Las palabras arrastrables se generan por JavaScript -->
    </div>

  </div>

</main>

<!-- Pantalla de victoria -->
<div class="pantalla-flotante" id="pantallaVictoria" hidden>
  <div class="parche pantalla-contenido">
    <h2>You did it! 🎉</h2>
    <p>You completed the 10 body parts in english.</p>
    <p class="destacado">Level 2 unlocked!</p>
    <a href="Astraltravel.html" class="boton-primario">Back to Astral Travel</a>
  </div>
</div>

<!-- Pantalla de fin de juego (sin vidas) -->
<div class="pantalla-flotante" id="pantallaDerrota" hidden>
  <div class="parche pantalla-contenido">
    <h2>You almost made it! 💫</h2>
    <p>Your lives are over. Try again!</p>
    <button class="boton-primario" id="botonReintentar">Retry</button>
  </div>
</div>

<script src="JavaScript/Nivel1.js"></script>
</body>
</html>
